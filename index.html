<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#5b21b6">
<title>OlaqVerify</title>

<style>
:root{
  --purple:#5b21b6;
  --purple2:#3b0764;
  --purpleLight:#f0e7ff;
  --bg:#f5f3f8;
  --card:#ffffff;
  --text:#20152e;
  --muted:#786b86;
  --border:#e7e1ed;
  --green:#13a56b;
  --red:#e5484d;
  --shadow:0 8px 28px rgba(60,20,90,.08);
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html{
  scroll-behavior:smooth;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
}

button,input,select{
  font:inherit;
}

button{
  cursor:pointer;
}

a{
  color:inherit;
  text-decoration:none;
}

/* AUTH */

#authScreen{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:
    radial-gradient(circle at top left,rgba(91,33,182,.16),transparent 35%),
    radial-gradient(circle at bottom right,rgba(59,7,100,.13),transparent 35%),
    var(--bg);
}

.authBox{
  width:min(430px,100%);
  background:var(--card);
  border:1px solid var(--border);
  border-radius:22px;
  box-shadow:var(--shadow);
  padding:28px;
}

.authLogo{
  width:52px;
  height:52px;
  border-radius:15px;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#fff;
  font-weight:900;
  font-size:21px;
  margin-bottom:14px;
  background:linear-gradient(135deg,var(--purple),var(--purple2));
}

.authTitle{
  font-size:27px;
  font-weight:900;
  margin-bottom:7px;
}

.authSubtitle{
  color:var(--muted);
  font-size:14px;
  line-height:1.5;
  margin-bottom:23px;
}

.authTabs{
  display:grid;
  grid-template-columns:1fr 1fr;
  background:#f3eef8;
  padding:4px;
  border-radius:11px;
  margin-bottom:20px;
}

.authTabs button{
  border:0;
  background:transparent;
  padding:11px;
  border-radius:8px;
  color:var(--muted);
  font-weight:800;
}

.authTabs button.active{
  color:var(--purple);
  background:#fff;
  box-shadow:0 2px 8px rgba(50,20,70,.08);
}

.formGroup{
  margin-bottom:15px;
}

.formGroup label{
  display:block;
  font-size:13px;
  font-weight:800;
  margin-bottom:7px;
}

.formGroup input{
  width:100%;
  border:1px solid var(--border);
  border-radius:11px;
  padding:13px;
  outline:none;
  background:#fff;
  color:var(--text);
}

.formGroup input:focus{
  border-color:var(--purple);
  box-shadow:0 0 0 3px rgba(91,33,182,.08);
}

.primaryBtn{
  width:100%;
  border:0;
  color:#fff;
  padding:13px;
  border-radius:11px;
  font-weight:900;
  background:linear-gradient(135deg,var(--purple),var(--purple2));
}

.authNote{
  margin-top:15px;
  color:var(--muted);
  font-size:11px;
  line-height:1.5;
  text-align:center;
}

/* APP */

#app{
  display:none;
}

.topbar{
  height:64px;
  position:sticky;
  top:0;
  z-index:50;
  background:rgba(255,255,255,.96);
  border-bottom:1px solid var(--border);
  backdrop-filter:blur(10px);
}

.topbarInner{
  width:min(1050px,100%);
  height:100%;
  margin:auto;
  padding:0 20px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.brand{
  display:flex;
  align-items:center;
  gap:10px;
}

.logo{
  width:39px;
  height:39px;
  border-radius:12px;
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:900;
  background:linear-gradient(135deg,var(--purple),var(--purple2));
}

.brandText{
  font-weight:900;
  letter-spacing:-.3px;
}

.topActions{
  display:flex;
  gap:8px;
}

.iconBtn{
  width:38px;
  height:38px;
  border:1px solid var(--border);
  background:#fff;
  border-radius:11px;
  display:flex;
  align-items:center;
  justify-content:center;
  color:var(--purple);
  font-weight:900;
}

.container{
  width:min(1050px,100%);
  margin:auto;
  padding:20px 20px 100px;
}

.page{
  display:none;
}

.page.active{
  display:block;
  animation:fade .18s ease;
}

@keyframes fade{
  from{
    opacity:0;
    transform:translateY(4px);
  }
  to{
    opacity:1;
    transform:translateY(0);
  }
}

.hero{
  padding:8px 0 20px;
}

.hero h1{
  font-size:27px;
  letter-spacing:-.7px;
  margin-bottom:7px;
}

.hero p{
  color:var(--muted);
  font-size:14px;
  line-height:1.5;
}

/* CARDS */

.card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:17px;
  box-shadow:var(--shadow);
  overflow:hidden;
  margin-bottom:17px;
}

.cardHeader{
  padding:17px 18px;
  border-bottom:1px solid var(--border);
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}

.cardHeader strong{
  font-size:15px;
}

.balanceCard{
  color:#fff;
  padding:21px;
  border-radius:18px;
  margin-bottom:18px;
  background:linear-gradient(135deg,var(--purple),var(--purple2));
  box-shadow:0 12px 30px rgba(59,7,100,.2);
}

.balanceLabel{
  font-size:12px;
  opacity:.82;
  margin-bottom:8px;
}

.balanceAmount{
  font-size:30px;
  font-weight:900;
  letter-spacing:-1px;
}

.balanceBottom{
  margin-top:17px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}

.balanceUser{
  font-size:12px;
  opacity:.85;
}

.smallWhiteBtn{
  border:0;
  padding:9px 13px;
  border-radius:9px;
  color:var(--purple2);
  background:#fff;
  font-weight:900;
}

/* QUICK ACCESS */

.quickGrid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:12px;
  margin-bottom:18px;
}

.quickCard{
  background:#fff;
  border:1px solid var(--border);
  border-radius:15px;
  padding:16px;
  cursor:pointer;
  transition:.15s;
}

.quickCard:hover{
  transform:translateY(-2px);
  box-shadow:var(--shadow);
}

.quickIcon{
  width:38px;
  height:38px;
  border-radius:11px;
  display:flex;
  align-items:center;
  justify-content:center;
  color:var(--purple);
  background:var(--purpleLight);
  font-weight:900;
  margin-bottom:11px;
}

.quickCard strong{
  display:block;
  font-size:14px;
  margin-bottom:4px;
}

.quickCard span{
  display:block;
  color:var(--muted);
  font-size:11px;
}

/* LISTS */

.list{
  padding:0 18px;
}

.listItem{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  padding:15px 0;
  border-bottom:1px solid var(--border);
}

.listItem:last-child{
  border-bottom:0;
}

.listLeft{
  min-width:0;
}

.listTitle{
  font-weight:800;
  font-size:13px;
}

.listSub{
  color:var(--muted);
  font-size:11px;
  margin-top:4px;
}

.price{
  font-weight:900;
  white-space:nowrap;
}

.empty{
  padding:35px 20px;
  text-align:center;
  color:var(--muted);
  font-size:13px;
}

/* SEARCH */

.toolbar{
  display:flex;
  gap:10px;
  margin-bottom:15px;
}

.search{
  flex:1;
  border:1px solid var(--border);
  border-radius:11px;
  background:#fff;
  padding:12px;
  outline:none;
}

.filter{
  border:1px solid var(--border);
  border-radius:11px;
  background:#fff;
  padding:12px;
  outline:none;
}

.search:focus,
.filter:focus{
  border-color:var(--purple);
}

/* NUMBERS */

.numberGrid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
}

.numberCard{
  background:#fff;
