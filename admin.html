<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OlaqVerify Admin</title>

  <style>
    :root{
      --purple:#5b21b6;
      --purple2:#3b0764;
      --purpleLight:#f0e7ff;
      --bg:#f5f3f8;
      --card:#fff;
      --text:#20152e;
      --muted:#786b86;
      --border:#e7e1ed;
      --green:#13a56b;
      --red:#e5484d;
      --orange:#f59e0b;
      --shadow:0 8px 28px rgba(60,20,90,.08);
    }

    *{
      box-sizing:border-box;
      margin:0;
      padding:0;
    }

    body{
      font-family:Arial,Helvetica,sans-serif;
      background:var(--bg);
      color:var(--text);
    }

    button,input{
      font:inherit;
    }

    .topbar{
      background:linear-gradient(135deg,var(--purple),var(--purple2));
      color:#fff;
      padding:18px;
      position:sticky;
      top:0;
      z-index:10;
      box-shadow:0 5px 20px rgba(0,0,0,.12);
    }

    .topbarInner{
      max-width:1000px;
      margin:auto;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
    }

    .brand{
      font-size:21px;
      font-weight:900;
    }

    .adminLabel{
      font-size:11px;
      opacity:.8;
      margin-top:3px;
    }

    .logoutBtn{
      border:1px solid rgba(255,255,255,.25);
      background:rgba(255,255,255,.12);
      color:#fff;
      padding:9px 13px;
      border-radius:9px;
      font-weight:800;
      cursor:pointer;
    }

    .container{
      width:calc(100% - 28px);
      max-width:1000px;
      margin:20px auto 40px;
    }

    .loginWrap{
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:20px;
    }

    .loginCard{
      width:100%;
      max-width:390px;
      background:#fff;
      border-radius:18px;
      padding:25px;
      box-shadow:var(--shadow);
      border:1px solid var(--border);
    }

    .loginLogo{
      width:58px;
      height:58px;
      border-radius:16px;
      background:linear-gradient(135deg,var(--purple),var(--purple2));
      color:#fff;
      display:flex;
      align-items:center;
      justify-content:center;
      font-weight:900;
      font-size:22px;
      margin-bottom:15px;
    }

    .loginCard h1{
      font-size:23px;
      margin-bottom:6px;
    }

    .loginCard p{
      color:var(--muted);
      font-size:12px;
      line-height:1.5;
      margin-bottom:20px;
    }

    .formGroup{
      margin-bottom:14px;
    }

    label{
      display:block;
      font-size:11px;
      font-weight:800;
      margin-bottom:7px;
    }

    input{
      width:100%;
      border:1px solid var(--border);
      background:#fff;
      outline:none;
      padding:13px;
      border-radius:10px;
      color:var(--text);
    }

    input:focus{
      border-color:var(--purple);
    }

    .primaryBtn{
      width:100%;
      border:0;
      background:linear-gradient(135deg,var(--purple),var(--purple2));
      color:#fff;
      padding:13px;
      border-radius:10px;
      font-weight:900;
      cursor:pointer;
    }

    .loginError{
      color:var(--red);
      font-size:11px;
      margin-top:10px;
      text-align:center;
      min-height:15px;
    }

    .dashboard{
      display:none;
    }

    .pageTitle{
      margin-bottom:18px;
    }

    .pageTitle h1{
      font-size:25px;
      margin-bottom:5px;
    }

    .pageTitle p{
      color:var(--muted);
      font-size:12px;
    }

    .stats{
      display:grid;
      grid-template-columns:repeat(4,1fr);
      gap:12px;
      margin-bottom:20px;
    }

    .stat{
      background:var(--card);
      border:1px solid var(--border);
      border-radius:15px;
      padding:16px;
      box-shadow:var(--shadow);
    }

    .statLabel{
      color:var(--muted);
      font-size:10px;
      font-weight:800;
      text-transform:uppercase;
    }

    .statValue{
      font-size:22px;
      font-weight:900;
      margin-top:7px;
    }

    .toolbar{
      background:#fff;
      border:1px solid var(--border);
      border-radius:15px;
      padding:14px;
      margin-bottom:15px;
      box-shadow:var(--shadow);
    }

    .search{
      max-width:500px;
    }

    .paymentList{
      display:grid;
      gap:12px;
    }

    .paymentCard{
      background:#fff;
      border:1px solid var(--border);
      border-radius:16px;
      padding:17px;
      box-shadow:var(--shadow);
    }

    .paymentTop{
      display:flex;
      justify-content:space-between;
      gap:10px;
      align-items:flex-start;
      margin-bottom:13px;
    }

    .paymentAmount{
      font-size:21px;
      font-weight:900;
    }

    .status{
      display:inline-block;
      padding:6px 9px;
      border-radius:8px;
      font-size:10px;
      font-weight:900;
    }

    .pending{
      background:#fff4d6;
      color:#a16207;
    }

    .approved{
      background:#dcfce9;
      color:#087443;
    }

    .rejected{
      background:#fee2e2;
      color:#b4232a;
    }

    .details{
      display:grid;
      grid-template-columns:repeat(2,1fr);
      gap:10px;
      margin-bottom:15px;
    }

    .detail{
      background:#faf8fc;
      border:1px solid var(--border);
      border-radius:10px;
      padding:10px;
    }

    .detailLabel{
      color:var(--muted);
      font-size:9px;
      font-weight:800;
      margin-bottom:4px;
      text-transform:uppercase;
    }

    .detailValue{
      font-size:12px;
      font-weight:800;
      word-break:break-word;
    }

    .actions{
      display:flex;
      gap:8px;
    }

    .approveBtn,
    .rejectBtn{
      flex:1;
      border:0;
      color:#fff;
      padding:11px;
      border-radius:9px;
      font-weight:900;
      cursor:pointer;
    }

    .approveBtn{
      background:var(--green);
    }

    .rejectBtn{
      background:var(--red);
    }

    .empty{
      background:#fff;
      border:1px solid var(--border);
      border-radius:15px;
      padding:35px 20px;
      text-align:center;
      color:var(--muted);
      box-shadow:var(--shadow);
    }

    .empty strong{
      display:block;
      color:var(--text);
      margin-bottom:5px;
    }

    .toast{
      position:fixed;
      left:50%;
      bottom:20px;
      transform:translateX(-50%);
      background:#20152e;
      color:#fff;
      padding:12px 16px;
      border-radius:10px;
      font-size:12px;
      font-weight:800;
      display:none;
      z-index:100;
      max-width:90%;
      text-align:center;
    }

    @media(max-width:700px){
      .stats{
        grid-template-columns:repeat(2,1fr);
      }

      .details{
        grid-template-columns:1fr;
      }
    }

    @media(max-width:420px){
      .topbarInner{
        align-items:flex-start;
      }

      .stats{
        grid-template-columns:1fr 1fr;
      }

      .statValue{
        font-size:18px;
      }
    }
  </style>
</head>

<body>

  <!-- ADMIN LOGIN -->
  <div id="loginScreen" class="loginWrap">

    <div class="loginCard">

      <div class="loginLogo">O</div>

      <h1>OlaqVerify Admin</h1>

      <p>
        Sign in to review and manually approve or reject
        customer payment requests.
      </p>

      <form onsubmit="adminLogin(event)">

        <div class="formGroup">
          <label>Admin Username</label>
          <input
            id="adminUsername"
            type="text"
            placeholder="Enter admin username"
            autocomplete="username"
            required
          >
        </div>

        <div class="formGroup">
          <label>Admin Password</label>
          <input
            id="adminPassword"
            type="password"
            placeholder="Enter admin password"
            autocomplete="current-password"
            required
          >
        </div>

        <button class="primaryBtn" type="submit">
          Login to Admin
        </button>

        <div id="loginError" class="loginError"></div>

      </form>

    </div>

  </div>


  <!-- ADMIN DASHBOARD -->
  <div id="dashboard" class="dashboard">

    <div class="topbar">

      <div class="topbarInner">

        <div>
          <div class="brand">OlaqVerify</div>
          <div class="adminLabel">Administrator Dashboard</div>
        </div>

        <button class="logoutBtn" onclick="adminLogout()">
          Logout
        </button>

      </div>

    </div>


    <main class="container">

      <div class="pageTitle">
        <h1>Payment Dashboard</h1>
        <p>Review PalmPay payment requests submitted by customers.</p>
      </div>


      <!-- STATISTICS -->
      <div class="stats">

        <div class="stat">
          <div class="statLabel">Pending</div>
          <div id="pendingCount" class="statValue">0</div>
        </div>

        <div class="stat">
          <div class="statLabel">Approved</div>
          <div id="approvedCount" class="statValue">0</div>
        </div>

        <div class="stat">
          <div class="statLabel">Rejected</div>
          <div id="rejectedCount" class="statValue">0</div>
        </div>

        <div class="stat">
          <div class="statLabel">Approved ₦</div>
          <div id="approvedAmount" class="statValue">₦0</div>
        </div>

      </div>


      <!-- SEARCH -->
      <div class="toolbar">

        <input
          id="searchInput"
          class="search"
          type="search"
          placeholder="Search reference, username or amount..."
          oninput="renderPayments()"
        >

      </div>


      <!-- PAYMENTS -->
      <div id="paymentList" class="paymentList"></div>

    </main>

  </div>


  <div id="toast" class="toast"></div>


  <script>

    /*
      --------------------------------------------------
      OLAQVERIFY ADMIN
      --------------------------------------------------

      IMPORTANT:
      This version uses localStorage because your
      current OlaqVerify frontend also uses localStorage.

      It is therefore a TESTING / SINGLE-BROWSER admin
      system, not a production backend.
    */


    const PAYMENT_KEY = "olaqverify_payment_requests_v1";
    const ADMIN_SESSION_KEY = "olaqverify_admin_session_v1";


    /*
      ADMIN LOGIN

      Change these two values before using the admin page.

      IMPORTANT:
      This is NOT secure for a production application
      because the credentials are visible in frontend code.
    */

    const ADMIN_USERNAME = "admin";
    const ADMIN_PASSWORD = "OlaqAdmin123";


    function getPayments(){

      try{

        return JSON.parse(
          localStorage.getItem(PAYMENT_KEY)
        ) || [];

      }catch(error){

        return [];

      }

    }


    function savePayments(payments){

      localStorage.setItem(
        PAYMENT_KEY,
        JSON.stringify(payments)
      );

    }


    function adminLogin(event){

      event.preventDefault();

      const username =
        document
          .getElementById("adminUsername")
          .value
          .trim();

      const password =
        document
          .getElementById("adminPassword")
          .value;

      const error =
        document.getElementById("loginError");


      if(
        username === ADMIN_USERNAME &&
        password === ADMIN_PASSWORD
      ){

        sessionStorage.setItem(
          ADMIN_SESSION_KEY,
          "true"
        );

        showDashboard();

      }else{

        error.textContent =
          "Invalid admin username or password.";

      }

    }


    function adminLogout(){

      sessionStorage.removeItem(
        ADMIN_SESSION_KEY
      );

      location.reload();

    }


    function showDashboard(){

      document.getElementById(
        "loginScreen"
      ).style.display = "none";

      document.getElementById(
        "dashboard"
      ).style.display = "block";

      renderPayments();

    }


    function formatMoney(amount){

      return "₦" +
        Number(amount || 0)
          .toLocaleString("en-NG");

    }


    function escapeHTML(value){

      return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

    }


    function formatDate(date){

      if(!date){
        return "Unknown";
      }

      const d = new Date(date);

      if(Number.isNaN(d.getTime())){
        return "Unknown";
      }

      return d.toLocaleString(
        "en-NG",
        {
          dateStyle:"medium",
          timeStyle:"short"
        }
      );

    }


    function renderPayments(){

      const payments = getPayments();

      const search =
        document
          .getElementById("searchInput")
          .value
          .trim()
          .toLowerCase();


      const filtered =
        payments.filter(function(payment){

          const text = [

            payment.username,
            payment.email,
            payment.reference,
            payment.amount,
            payment.status

          ]
          .join(" ")
          .toLowerCase();

          return text.includes(search);

        });


      updateStats(payments);


      const list =
        document.getElementById(
          "paymentList"
        );


      if(filtered.length === 0){

        list.innerHTML = `
          <div class="empty">
            <strong>No payment requests found</strong>
            There are currently no payment requests matching your search.
          </div>
        `;

        return;

      }


      filtered.sort(function(a,b){

        return new Date(
          b.createdAt || 0
        ) - new Date(
          a.createdAt || 0
        );

      });


      list.innerHTML =
        filtered.map(function(payment){

          const status =
            String(
              payment.status || "pending"
            ).toLowerCase();


          let statusClass = "pending";

          if(status === "approved"){
            statusClass = "approved";
          }

          if(status === "rejected"){
            statusClass = "rejected";
          }


          const actionButtons =
            status === "pending"

            ? `
              <div class="actions">

                <button
                  class="approveBtn"
                  onclick="approvePayment('${escapeJS(payment.id)}')"
                >
                  ✓ Approve Payment
                </button>

                <button
                  class="rejectBtn"
                  onclick="rejectPayment('${escapeJS(payment.id)}')"
                >
                  ✕ Reject
                </button>

              </div>
            `

            : `
              <div class="detail">
                <div class="detailLabel">
                  Processed
                </div>

                <div class="detailValue">
                  ${escapeHTML(payment.processedAt
                    ? formatDate(payment.processedAt)
                    : "Already processed")}
                </div>
              </div>
            `;


          return `

            <div class="paymentCard">

              <div class="paymentTop">

                <div>
                  <div class="paymentAmount">
                    ${formatMoney(payment.amount)}
                  </div>

                  <div style="color:var(--muted);font-size:11px;margin-top:4px;">
                    Payment request
                  </div>
                </div>

                <span class="status ${statusClass}">
                  ${escapeHTML(status.toUpperCase())}
                </span>

              </div>


              <div class="details">

                <div class="detail">

                  <div class="detailLabel">
                    Customer
                  </div>

                  <div class="detailValue">
                    ${escapeHTML(
                      payment.username ||
                      "Unknown customer"
                    )}
                  </div>

                </div>


                <div class="detail">

                  <div class="detailLabel">
                    Email
                  </div>

                  <div class="detailValue">
                    ${escapeHTML(
                      payment.email ||
                      "Not provided"
                    )}
                  </div>

                </div>


                <div class="detail">

                  <div class="detailLabel">
                    Transaction Reference
                  </div>

                  <div class="detailValue">
                    ${escapeHTML(
                      payment.reference ||
                      "Not provided"
                    )}
                  </div>

                </div>


                <div class="detail">

                  <div class="detailLabel">
                    Submitted
                  </div>

                  <div class="detailValue">
                    ${escapeHTML(
                      formatDate(
                        payment.createdAt
                      )
                    )}
                  </div>

                </div>

              </div>


              ${actionButtons}

            </div>

          `;

        })
        .join("");

    }


    function escapeJS(value){

      return String(value ?? "")
        .replace(/\\/g,"\\\\")
        .replace(/'/g,"\\'")
        .replace(/"/g,"&quot;");

    }


    function updateStats(payments){

      let pending = 0;
      let approved = 0;
      let rejected = 0;
      let approvedAmount = 0;


      payments.forEach(function(payment){

        const status =
          String(
            payment.status || "pending"
          ).toLowerCase();


        if(status === "pending"){
          pending++;
        }

        if(status === "approved"){

          approved++;

          approvedAmount +=
            Number(payment.amount || 0);

        }

        if(status === "rejected"){
          rejected++;
        }

      });


      document.getElementById(
        "pendingCount"
      ).textContent = pending;


      document.getElementById(
        "approvedCount"
      ).textContent = approved;


      document.getElementById(
        "rejectedCount"
      ).textContent = rejected;


      document.getElementById(
        "approvedAmount"
      ).textContent =
        formatMoney(approvedAmount);

    }


    function approvePayment(id){

      const payments = getPayments();

      const index =
        payments.findIndex(function(payment){

          return String(payment.id) === String(id);

        });


      if(index === -1){

        showToast(
          "Payment request not found."
        );

        return;

      }


      if(
        payments[index].status === "approved"
      ){

        showToast(
          "This payment is already approved."
        );

        return;

      }


      const confirmed =
        confirm(
          "Approve this payment of " +
          formatMoney(
            payments[index].amount
          ) +
          "?\n\nOnly approve after you have verified the PalmPay transfer."
        );


      if(!confirmed){
        return;
      }


      payments[index].status =
        "approved";

      payments[index].processedAt =
        new Date().toISOString();


      savePayments(payments);

      renderPayments();


      showToast(
        "Payment approved."
      );

    }


    function rejectPayment(id){

      const payments = getPayments();

      const index =
        payments.findIndex(function(payment){

          return String(payment.id) === String(id);

        });


      if(index === -1){

        showToast(
          "Payment request not found."
        );

        return;

      }


      const confirmed =
        confirm(
          "Reject this payment request?"
        );


      if(!confirmed){
        return;
      }


      payments[index].status =
        "rejected";

      payments[index].processedAt =
        new Date().toISOString();


      savePayments(payments);

      renderPayments();


      showToast(
        "Payment rejected."
      );

    }


    function showToast(message){

      const toast =
        document.getElementById(
          "toast"
        );

      toast.textContent = message;

      toast.style.display = "block";


      clearTimeout(
        window.__toastTimer
      );


      window.__toastTimer =
        setTimeout(function(){

          toast.style.display = "none";

        },3000);

    }


    /*
      START
    */

    if(
      sessionStorage.getItem(
        ADMIN_SESSION_KEY
      ) === "true"
    ){

      showDashboard();

    }

  </script>

</body>
</html>
