<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OlaqVerify Admin</title>

  <style>
    :root{
      --purple:#5b21b6;
      --purple2:#3b0764;
      --purpleLight:#f0e7ff;
      --bg:#f5f3f8;
      --card:#ffffff;
      --text:#20152e;
      --muted:#786b86;
      --border:#e7e1ed;
      --green:#13a56b;
      --red:#e5484d;
      --orange:#d97706;
      --shadow:0 8px 28px rgba(60,20,90,.08);
    }

    *{
      box-sizing:border-box;
      margin:0;
      padding:0;
    }

    body{
      font-family:Arial,Helvetica,sans-serif;
      background:var(--bg);
      color:var(--text);
      min-height:100vh;
    }

    button,
    input{
      font:inherit;
    }

    .hidden{
      display:none !important;
    }

    /* LOGIN */

    #loginScreen{
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:20px;
      background:
        radial-gradient(circle at top right,#e9d5ff 0,#f5f3f8 40%,#f5f3f8 100%);
    }

    .loginCard{
      width:100%;
      max-width:420px;
      background:#fff;
      border:1px solid var(--border);
      border-radius:24px;
      padding:30px;
      box-shadow:var(--shadow);
    }

    .logo{
      width:62px;
      height:62px;
      border-radius:18px;
      background:linear-gradient(135deg,var(--purple),var(--purple2));
      color:#fff;
      display:flex;
      align-items:center;
      justify-content:center;
      font-weight:900;
      font-size:25px;
      margin-bottom:18px;
    }

    .loginCard h1{
      font-size:27px;
      margin-bottom:7px;
    }

    .loginCard p{
      color:var(--muted);
      line-height:1.5;
      margin-bottom:24px;
    }

    label{
      display:block;
      font-size:14px;
      font-weight:700;
      margin:14px 0 7px;
    }

    input{
      width:100%;
      padding:14px 15px;
      border:1px solid var(--border);
      border-radius:12px;
      outline:none;
      background:#fff;
      color:var(--text);
    }

    input:focus{
      border-color:var(--purple);
      box-shadow:0 0 0 3px rgba(91,33,182,.10);
    }

    .primaryBtn{
      width:100%;
      border:0;
      background:linear-gradient(135deg,var(--purple),var(--purple2));
      color:#fff;
      padding:14px;
      border-radius:12px;
      font-weight:800;
      cursor:pointer;
      margin-top:20px;
    }

    .primaryBtn:active,
    .actionBtn:active{
      transform:scale(.98);
    }

    .error{
      background:#fff0f0;
      color:#b4232a;
      border:1px solid #ffd1d3;
      padding:11px 12px;
      border-radius:10px;
      margin-top:14px;
      font-size:14px;
    }

    /* APP */

    #adminApp{
      min-height:100vh;
    }

    .topbar{
      position:sticky;
      top:0;
      z-index:20;
      background:#fff;
      border-bottom:1px solid var(--border);
      height:70px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding:0 22px;
    }

    .brand{
      display:flex;
      align-items:center;
      gap:11px;
      font-weight:900;
      font-size:19px;
    }

    .brandIcon{
      width:40px;
      height:40px;
      border-radius:12px;
      background:linear-gradient(135deg,var(--purple),var(--purple2));
      color:#fff;
      display:flex;
      align-items:center;
      justify-content:center;
      font-weight:900;
    }

    .adminBadge{
      color:var(--purple);
      background:var(--purpleLight);
      border-radius:999px;
      padding:8px 12px;
      font-size:12px;
      font-weight:800;
    }

    .logoutBtn{
      border:1px solid var(--border);
      background:#fff;
      color:var(--text);
      border-radius:10px;
      padding:9px 12px;
      cursor:pointer;
      font-weight:700;
    }

    .topRight{
      display:flex;
      align-items:center;
      gap:10px;
    }

    .container{
      width:min(1150px,100%);
      margin:auto;
      padding:25px 18px 50px;
    }

    .pageTitle{
      margin-bottom:20px;
    }

    .pageTitle h2{
      font-size:27px;
      margin-bottom:5px;
    }

    .pageTitle p{
      color:var(--muted);
    }

    /* STATS */

    .stats{
      display:grid;
      grid-template-columns:repeat(4,1fr);
      gap:14px;
      margin-bottom:22px;
    }

    .stat{
      background:var(--card);
      border:1px solid var(--border);
      border-radius:18px;
      padding:19px;
      box-shadow:var(--shadow);
    }

    .statLabel{
      color:var(--muted);
      font-size:13px;
      margin-bottom:8px;
    }

    .statValue{
      font-size:25px;
      font-weight:900;
    }

    /* TOOLBAR */

    .toolbar{
      background:#fff;
      border:1px solid var(--border);
      border-radius:16px;
      padding:13px;
      margin-bottom:16px;
      display:flex;
      gap:10px;
    }

    .toolbar input{
      margin:0;
    }

    .filter{
      min-width:145px;
      border:1px solid var(--border);
      background:#fff;
      border-radius:11px;
      padding:0 12px;
      color:var(--text);
      outline:none;
    }

    /* PAYMENT CARDS */

    #paymentList{
      display:grid;
      gap:14px;
    }

    .paymentCard{
      background:#fff;
      border:1px solid var(--border);
      border-radius:18px;
      padding:19px;
      box-shadow:var(--shadow);
    }

    .paymentTop{
      display:flex;
      justify-content:space-between;
      gap:15px;
      align-items:flex-start;
      margin-bottom:15px;
    }

    .paymentId{
      font-size:12px;
      color:var(--muted);
      margin-bottom:5px;
    }

    .paymentAmount{
      font-size:23px;
      font-weight:900;
    }

    .status{
      display:inline-flex;
      padding:7px 10px;
      border-radius:999px;
      font-size:12px;
      font-weight:800;
      text-transform:capitalize;
    }

    .status.pending{
      color:#a15c00;
      background:#fff4d6;
    }

    .status.approved{
      color:#08734a;
      background:#dff8ed;
    }

    .status.rejected{
      color:#b4232a;
      background:#ffe4e5;
    }

    .details{
      display:grid;
      grid-template-columns:repeat(2,1fr);
      gap:10px;
      margin-bottom:16px;
    }

    .detail{
      background:#faf9fb;
      border:1px solid #eee9f1;
      padding:11px;
      border-radius:11px;
    }

    .detail small{
      display:block;
      color:var(--muted);
      margin-bottom:4px;
      font-size:11px;
    }

    .detail strong{
      font-size:13px;
      word-break:break-word;
    }

    .actions{
      display:flex;
      gap:9px;
    }

    .actionBtn{
      border:0;
      border-radius:10px;
      padding:11px 14px;
      font-weight:800;
      cursor:pointer;
    }

    .approve{
      background:#dff8ed;
      color:#08734a;
    }

    .reject{
      background:#ffe4e5;
      color:#b4232a;
    }

    .disabled{
      opacity:.5;
      pointer-events:none;
    }

    .empty{
      text-align:center;
      background:#fff;
      border:1px dashed var(--border);
      border-radius:18px;
      padding:45px 20px;
      color:var(--muted);
    }

    .emptyIcon{
      font-size:35px;
      margin-bottom:10px;
    }

    /* TOAST */

    #toast{
      position:fixed;
      left:50%;
      bottom:22px;
      transform:translateX(-50%) translateY(100px);
      background:#20152e;
      color:#fff;
      padding:12px 16px;
      border-radius:11px;
      font-size:14px;
      z-index:100;
      transition:.25s;
      max-width:90%;
      text-align:center;
    }

    #toast.show{
      transform:translateX(-50%) translateY(0);
    }

    /* MOBILE */

    @media(max-width:800px){
      .stats{
        grid-template-columns:repeat(2,1fr);
      }
    }

    @media(max-width:600px){
      .topbar{
        padding:0 12px;
      }

      .brand span{
        display:none;
      }

      .adminBadge{
        display:none;
      }

      .container{
        padding:20px 12px 40px;
      }

      .pageTitle h2{
        font-size:23px;
      }

      .toolbar{
        flex-direction:column;
      }

      .filter{
        height:46px;
      }

      .details{
        grid-template-columns:1fr;
      }

      .paymentTop{
        flex-direction:column;
      }

      .actions{
        flex-direction:column;
      }

      .actionBtn{
        width:100%;
      }
    }
  </style>
</head>

<body>

  <!-- LOGIN SCREEN -->
  <section id="loginScreen">

    <div class="loginCard">

      <div class="logo">O</div>

      <h1>OlaqVerify Admin</h1>

      <p>
        Sign in to review customer payment requests.
      </p>

      <label for="adminUsername">Admin username</label>
      <input
        id="adminUsername"
        type="text"
        autocomplete="username"
        placeholder="Enter username"
      >

      <label for="adminPassword">Admin password</label>
      <input
        id="adminPassword"
        type="password"
        autocomplete="current-password"
        placeholder="Enter password"
      >

      <button class="primaryBtn" onclick="loginAdmin()">
        Sign In
      </button>

      <div id="loginError" class="error hidden"></div>

    </div>

  </section>


  <!-- ADMIN APP -->
  <section id="adminApp" class="hidden">

    <header class="topbar">

      <div class="brand">
        <div class="brandIcon">O</div>
        <span>OlaqVerify Admin</span>
      </div>

      <div class="topRight">
        <div class="adminBadge">ADMIN PANEL</div>

        <button class="logoutBtn" onclick="logoutAdmin()">
          Logout
        </button>
      </div>

    </header>


    <main class="container">

      <div class="pageTitle">
        <h2>Payment Dashboard</h2>
        <p>Review and manage customer funding requests.</p>
      </div>


      <!-- STATS -->

      <section class="stats">

        <div class="stat">
          <div class="statLabel">Pending</div>
          <div id="pendingCount" class="statValue">0</div>
        </div>

        <div class="stat">
          <div class="statLabel">Approved</div>
          <div id="approvedCount" class="statValue">0</div>
        </div>

        <div class="stat">
          <div class="statLabel">Rejected</div>
          <div id="rejectedCount" class="statValue">0</div>
        </div>

        <div class="stat">
          <div class="statLabel">Approved Amount</div>
          <div id="approvedAmount" class="statValue">₦0</div>
        </div>

      </section>


      <!-- SEARCH / FILTER -->

      <section class="toolbar">

        <input
          id="searchInput"
          type="search"
          placeholder="Search name, email, reference or payment ID..."
          oninput="renderPayments()"
        >

        <select
          id="statusFilter"
          class="filter"
          onchange="renderPayments()"
        >
          <option value="all">All payments</option>
          <option value="pending">Pending</option>
          <option value="approved">Approved</option>
          <option value="rejected">Rejected</option>
        </select>

      </section>


      <!-- PAYMENT LIST -->

      <section id="paymentList"></section>

    </main>

  </section>


  <div id="toast"></div>


  <script>

    /* =====================================================
       OLAQVERIFY ADMIN
       ===================================================== */

    const PAYMENT_KEY = "olaqverify_payment_requests_v1";

    const ADMIN_SESSION_KEY =
      "olaqverify_admin_session_v2";


    /*
      DEMO ADMIN LOGIN FOR LOCAL TESTING ONLY.

      Do not use this frontend password system for a
      production payment platform. Production admin
      authentication must be handled by a backend.
    */

    const ADMIN_USERNAME = "admin";
    const ADMIN_PASSWORD = "OlaqAdmin123";


    /* =====================================================
       STORAGE HELPERS
       ===================================================== */

    function getPayments(){

      try{

        const raw =
          localStorage.getItem(PAYMENT_KEY);

        if(!raw){
          return [];
        }

        const data = JSON.parse(raw);

        return Array.isArray(data) ? data : [];

      }catch(error){

        console.error("Could not read payments:", error);

        return [];

      }

    }


    function savePayments(payments){

      try{

        localStorage.setItem(
          PAYMENT_KEY,
          JSON.stringify(payments)
        );

        return true;

      }catch(error){

        console.error("Could not save payments:", error);

        showToast("Could not save payment data.");

        return false;

      }

    }


    /* =====================================================
       LOGIN
       ===================================================== */

    function loginAdmin(){

      const username =
        document.getElementById("adminUsername").value.trim();

      const password =
        document.getElementById("adminPassword").value;

      const errorBox =
        document.getElementById("loginError");


      errorBox.classList.add("hidden");


      if(
        username === ADMIN_USERNAME &&
        password === ADMIN_PASSWORD
      ){

        sessionStorage.setItem(
          ADMIN_SESSION_KEY,
          "logged_in"
        );

        showAdmin();

      }else{

        errorBox.textContent =
          "Incorrect admin username or password.";

        errorBox.classList.remove("hidden");

      }

    }


    function logoutAdmin(){

      sessionStorage.removeItem(
        ADMIN_SESSION_KEY
      );

      document.getElementById("adminApp")
        .classList.add("hidden");

      document.getElementById("loginScreen")
        .classList.remove("hidden");

      document.getElementById("adminUsername")
        .value = "";

      document.getElementById("adminPassword")
        .value = "";

    }


    function checkAdminSession(){

      const loggedIn =
        sessionStorage.getItem(
          ADMIN_SESSION_KEY
        );

      if(loggedIn === "logged_in"){

        showAdmin();

      }

    }


    function showAdmin(){

      document.getElementById("loginScreen")
        .classList.add("hidden");

      document.getElementById("adminApp")
        .classList.remove("hidden");

      renderPayments();

    }


    /* =====================================================
       FORMATTERS
       ===================================================== */

    function formatMoney(amount){

      return "₦" + Number(amount || 0)
        .toLocaleString("en-NG");

    }


    function formatDate(date){

      if(!date){
        return "Unknown";
      }

      const d = new Date(date);

      if(Number.isNaN(d.getTime())){
        return "Unknown";
      }

      return d.toLocaleString("en-NG", {
        dateStyle:"medium",
        timeStyle:"short"
      });

    }


    function escapeHTML(value){

      return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

    }


    /* =====================================================
       DASHBOARD STATS
       ===================================================== */

    function updateStats(){

      const payments = getPayments();

      let pending = 0;
      let approved = 0;
      let rejected = 0;
      let approvedAmount = 0;


      payments.forEach(payment => {

        const status =
          String(payment.status || "pending")
            .toLowerCase();


        if(status === "pending"){
          pending++;
        }

        if(status === "approved"){

          approved++;

          approvedAmount +=
            Number(payment.amount || 0);

        }

        if(status === "rejected"){
          rejected++;
        }

      });


      document.getElementById("pendingCount")
        .textContent = pending;

      document.getElementById("approvedCount")
        .textContent = approved;

      document.getElementById("rejectedCount")
        .textContent = rejected;

      document.getElementById("approvedAmount")
        .textContent = formatMoney(approvedAmount);

    }


    /* =====================================================
       RENDER PAYMENTS
       ===================================================== */

    function renderPayments(){

      updateStats();


      const list =
        document.getElementById("paymentList");

      const search =
        document.getElementById("searchInput")
          .value
          .trim()
          .toLowerCase();

      const filter =
        document.getElementById("statusFilter")
          .value;


      let payments = getPayments();


      payments.sort(function(a,b){

        const da =
          new Date(a.createdAt || 0).getTime();

        const db =
          new Date(b.createdAt || 0).getTime();

        return db - da;

      });


      payments = payments.filter(function(payment){

        const status =
          String(payment.status || "pending")
            .toLowerCase();

        if(
          filter !== "all" &&
          status !== filter
        ){
          return false;
        }


        if(!search){
          return true;
        }


        const searchable = [

          payment.id,
          payment.reference,
          payment.username,
          payment.name,
          payment.email,
          payment.userId,
          payment.amount

        ]
        .join(" ")
        .toLowerCase();


        return searchable.includes(search);

      });


      if(payments.length === 0){

        list.innerHTML = `
          <div class="empty">
            <div class="emptyIcon">💳</div>
            <strong>No payment requests found</strong>
            <p style="margin-top:7px;">
              Payment requests will appear here when available.
            </p>
          </div>
        `;

        return;

      }


      list.innerHTML =
        payments.map(createPaymentCard).join("");

    }


    /* =====================================================
       PAYMENT CARD
       ===================================================== */

    function createPaymentCard(payment){

      const status =
        String(payment.status || "pending")
          .toLowerCase();


      const username =
        payment.username ||
        payment.name ||
        "Unknown customer";


      const email =
        payment.email ||
        "No email provided";


      const reference =
        payment.reference ||
        "No reference";


      const amount =
        Number(payment.amount || 0);


      const createdAt =
        formatDate(payment.createdAt);


      const processedAt =
        payment.processedAt
          ? formatDate(payment.processedAt)
          : "";


      let actions = "";


      if(status === "pending"){

        actions = `
          <div class="actions">

            <button
              class="actionBtn approve"
              onclick="approvePayment('${escapeJS(payment.id)}')"
            >
              ✓ Approve Payment
            </button>

            <button
              class="actionBtn reject"
              onclick="rejectPayment('${escapeJS(payment.id)}')"
            >
              ✕ Reject Payment
            </button>

          </div>
        `;

      }else{

        actions = `
          <div class="actions">

            <button
              class="actionBtn disabled"
              disabled
            >
              ${status === "approved"
                ? "✓ Payment Approved"
                : "✕ Payment Rejected"}
            </button>

          </div>
        `;

      }


      return `

        <article class="paymentCard">

          <div class="paymentTop">

            <div>

              <div class="paymentId">
                ${escapeHTML(payment.id || "PAYMENT")}
              </div>

              <div class="paymentAmount">
                ${formatMoney(amount)}
              </div>

            </div>

            <div class="status ${escapeHTML(status)}">
              ${escapeHTML(status)}
            </div>

          </div>


          <div class="details">

            <div class="detail">
              <small>Customer</small>
              <strong>
                ${escapeHTML(username)}
              </strong>
            </div>

            <div class="detail">
              <small>Email</small>
              <strong>
                ${escapeHTML(email)}
              </strong>
            </div>

            <div class="detail">
              <small>Transaction Reference</small>
              <strong>
                ${escapeHTML(reference)}
              </strong>
            </div>

            <div class="detail">
              <small>User ID</small>
              <strong>
                ${escapeHTML(payment.userId || "Not available")}
              </strong>
            </div>

            <div class="detail">
              <small>Submitted</small>
              <strong>
                ${escapeHTML(createdAt)}
              </strong>
            </div>

            ${
              processedAt
              ? `
                <div class="detail">
                  <small>Processed</small>
                  <strong>
                    ${escapeHTML(processedAt)}
                  </strong>
                </div>
              `
              : ""
            }

          </div>


          ${actions}

        </article>

      `;

    }


    function escapeJS(value){

      return String(value ?? "")
        .replace(/\\/g,"\\\\")
        .replace(/'/g,"\\'")
        .replace(/"/g,'\\"')
        .replace(/\n/g,"\\n")
        .replace(/\r/g,"\\r");

    }


    /* =====================================================
       APPROVE PAYMENT
       ===================================================== */

    function approvePayment(paymentId){

      const confirmed =
        confirm(
          "Have you personally verified this PalmPay transfer?\n\n" +
          "Only approve a payment after confirming the transfer."
        );


      if(!confirmed){
        return;
      }


      const payments = getPayments();


      const index =
        payments.findIndex(function(payment){

          return String(payment.id) ===
            String(paymentId);

        });


      if(index === -1){

        showToast("Payment request not found.");

        return;

      }


      if(
        String(payments[index].status)
          .toLowerCase() !== "pending"
      ){

        showToast("This payment has already been processed.");

        return;

      }


      payments[index].status = "approved";

      payments[index].processedAt =
        new Date().toISOString();

      payments[index].processedBy =
        "admin";


      if(savePayments(payments)){

        showToast("Payment approved.");

        renderPayments();

      }

    }


    /* =====================================================
       REJECT PAYMENT
       ===================================================== */

    function rejectPayment(paymentId){

      const confirmed =
        confirm(
          "Reject this payment request?"
        );


      if(!confirmed){
        return;
      }


      const payments = getPayments();


      const index =
        payments.findIndex(function(payment){

          return String(payment.id) ===
            String(paymentId);

        });


      if(index === -1){

        showToast("Payment request not found.");

        return;

      }


      if(
        String(payments[index].status)
          .toLowerCase() !== "pending"
      ){

        showToast("This payment has already been processed.");

        return;

      }


      payments[index].status = "rejected";

      payments[index].processedAt =
        new Date().toISOString();

      payments[index].processedBy =
        "admin";


      if(savePayments(payments)){

        showToast("Payment rejected.");

        renderPayments();

      }

    }


    /* =====================================================
       TOAST
       ===================================================== */

    let toastTimer;


    function showToast(message){

      const toast =
        document.getElementById("toast");

      toast.textContent = message;

      toast.classList.add("show");


      clearTimeout(toastTimer);


      toastTimer =
        setTimeout(function(){

          toast.classList.remove("show");

        },3000);

    }


    /* =====================================================
       AUTO REFRESH
       ===================================================== */

    setInterval(function(){

      if(
        sessionStorage.getItem(
          ADMIN_SESSION_KEY
        ) === "logged_in"
      ){

        renderPayments();

      }

    },5000);


    /* =====================================================
       START
       ===================================================== */

    checkAdminSession();

  </script>

</body>
</html>
